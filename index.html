<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Verity & Moggity Arena</title>
    <style>
        body { background: #0d0d0d; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 10px; }
        h1 { margin: 5px 0; color: #ffcc00; font-size: 24px; }
        canvas { background: #1a1a1a; border: 4px solid #333; box-shadow: 0 0 30px rgba(0,0,0,0.9); display: block; margin: 10px auto; border-radius: 8px; }
        #ui { margin-top: 10px; background: #222; padding: 10px; border-radius: 8px; display: inline-block; border: 1px solid #444; }
        button { background: #ffcc00; border: none; padding: 8px 16px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 4px; color: #111; transition: 0.2s; }
        button:hover { background: #e6b800; transform: scale(1.05); }
        .stat-box { font-size: 15px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>🟡 Verity & Moggity Battle Arena ⚔️</h1>
    <p>Use <b>W, A, S, D</b> ou <b>Setas</b> para mover. Suas espadas orbitais causam dano ao tocar nos rivais!</p>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="ui">
        <div class="stat-box">Moedas: 💰 <span id="coins">0</span> | HP: ❤️ <span id="hp">100</span> | Elo: 🏆 <span id="elo">1000</span></div>
        <div>
            <button onclick="buyUpgrade('speed')">Velocidade (50 💰)</button>
            <button onclick="buyUpgrade('damage')">Dano Espada (100 💰)</button>
            <button onclick="buyUpgrade('heal')">Curar (25 💰)</button>
            <button onclick="buySword('Lendária', 1000)">Espada Lendária (1000 💰)</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('https://verity-battles.onrender.com'); 

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Carrega as imagens da mesma pasta
        const verityImg = new Image();
        verityImg.src = 'verity.png';

        const espadaImg = new Image();
        espadaImg.src = 'espada.png';

        let myId = null;
        let players = {};
        let obstacles = [
            { x: 300, y: 200, w: 200, h: 40 },
            { x: 150, y: 400, w: 60, h: 120 },
            { x: 600, y: 350, w: 80, h: 80 }
        ];
        const keys = { up: false, down: false, left: false, right: false };
        const arenaSize = { width: 800, height: 600 };

        window.addEventListener('keydown', (e) => updateKeys(e, true));
        window.addEventListener('keyup', (e) => updateKeys(e, false));

        function updateKeys(e, isPressed) {
            if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = isPressed;
            if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = isPressed;
            if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = isPressed;
            if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = isPressed;
        }

        socket.on('init', (data) => {
            myId = data.id;
            players = data.players;
            if(data.obstacles) obstacles = data.obstacles;
        });

        socket.on('updatePlayers', (serverPlayers) => {
            for (let id in serverPlayers) {
                if (id === myId && players[myId]) {
                    players[myId].hp = serverPlayers[id].hp;
                    players[myId].coins = serverPlayers[id].coins;
                    players[myId].speed = serverPlayers[id].speed;
                    players[myId].maxHp = serverPlayers[id].maxHp;
                    players[myId].swordAngle = serverPlayers[id].swordAngle;
                    players[myId].elo = serverPlayers[id].elo;
                } else {
                    players[id] = serverPlayers[id];
                }
            }

            if (myId && players[myId]) {
                document.getElementById('coins').innerText = players[myId].coins;
                document.getElementById('hp').innerText = Math.round(players[myId].hp);
                document.getElementById('elo').innerText = players[myId].elo || 1000;
            }
        });

        function buyUpgrade(type) {
            socket.emit('upgrade', type);
        }

        function buySword(name, cost) {
            socket.emit('buySword', { name, cost });
        }

        function gameLoop() {
            if (myId && players[myId]) {
                let p = players[myId];
                let currentSpeed = p.speed || 4;

                let nextX = p.x;
                let nextY = p.y;

                if (keys.up) nextY -= currentSpeed;
                if (keys.down) nextY += currentSpeed;
                if (keys.left) nextX -= currentSpeed;
                if (keys.right) nextX += currentSpeed;

                // Limites da arena
                nextX = Math.max(p.radius, Math.min(arenaSize.width - p.radius, nextX));
                nextY = Math.max(p.radius, Math.min(arenaSize.height - p.radius, nextY));

                // Checagem básica de colisão local com barreiras/obstáculos
                let collided = false;
                for (let obs of obstacles) {
                    if (nextX + p.radius > obs.x && nextX - p.radius < obs.x + obs.w &&
                        nextY + p.radius > obs.y && nextY - p.radius < obs.y + obs.h) {
                        collided = true;
                        break;
                    }
                }

                if (!collided) {
                    p.x = nextX;
                    p.y = nextY;
                }

                socket.emit('move', keys);
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenha Grid
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Desenha Barreiras / Obstáculos na Arena
            ctx.fillStyle = '#444';
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            }

            // Desenha Jogadores e Espadas Orbitais
            for (let id in players) {
                let p = players[id];

                ctx.save();
                ctx.translate(p.x, p.y);

                // Desenha o Verity/Moggity
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();

                if (verityImg.complete) {
                    ctx.drawImage(verityImg, -p.radius, -p.radius, p.radius * 2, p.radius * 2);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.fill();
                }
                ctx.restore();

                // Borda do Jogador
                ctx.strokeStyle = (id === myId) ? '#00ffcc' : '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.stroke();

                // Desenha a Espada Girando em volta (Órbita)
                let angle = p.swordAngle || 0;
                let orbitRadius = p.radius + 25;
                let swordX = p.x + Math.cos(angle) * orbitRadius;
                let swordY = p.y + Math.sin(angle) * orbitRadius;

                ctx.save();
                ctx.translate(swordX, swordY);
                ctx.rotate(angle + Math.PI / 4);
                if (espadaImg.complete) {
                    ctx.drawImage(espadaImg, -15, -15, 30, 30);
                } else {
                    ctx.fillStyle = '#ff3333';
                    ctx.fillRect(-10, -5, 20, 10);
                }
                ctx.restore();

                // Barra de Vida
                ctx.fillStyle = 'red';
                ctx.fillRect(p.x - 20, p.y - p.radius - 12, 40, 6);
                ctx.fillStyle = 'lime';
                ctx.fillRect(p.x - 20, p.y - p.radius - 12, Math.max(0, (p.hp / p.maxHp) * 40), 6);
            }
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
