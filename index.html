<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Verity Arena Online</title>
    <style>
        body { background: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        canvas { background: #222; border: 4px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.8); display: block; margin: 10px auto; }
        #ui { margin-top: 10px; }
        button { background: #ffcc00; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 5px; }
        button:hover { background: #e6b800; }
    </style>
</head>
<body>
    <h1>🟡 Verity Arena Online ⚔️</h1>
    <p>Use as **Setas do Teclado** ou **W, A, S, D** para mover seu Verity instantaneamente!</p>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="ui">
        <div id="stats">Moedas: 💰 <span id="coins">0</span> | HP: ❤️ <span id="hp">100</span></div>
        <button onclick="buyUpgrade('speed')">Upgrade Velocidade (10 💰)</button>
        <button onclick="buyUpgrade('damage')">Upgrade Dano (15 💰)</button>
        <button onclick="buyUpgrade('heal')">Curar Vida (5 💰)</button>
    </div>

    <!-- Script do Socket.io fornecido pelo servidor -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('https://verity-battles.onrender.com'); 

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Carrega a imagem verity.png diretamente da mesma pasta
        const verityImg = new Image();
        verityImg.src = 'verity.png';

        let myId = null;
        let players = {};
        const keys = { up: false, down: false, left: false, right: false };
        const arenaSize = { width: 800, height: 600 };

        window.addEventListener('keydown', (e) => updateKeys(e, true));
        window.addEventListener('keyup', (e) => updateKeys(e, false));

        function updateKeys(e, isPressed) {
            if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = isPressed;
            if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = isPressed;
            if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = isPressed;
            if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = isPressed;
        }

        socket.on('init', (data) => {
            myId = data.id;
            players = data.players;
        });

        socket.on('updatePlayers', (serverPlayers) => {
            // Atualiza os dados dos outros jogadores, mas mantém a posição local suave se o ID for o nosso
            for (let id in serverPlayers) {
                if (id === myId && players[myId]) {
                    // Mantém nossa posição local atualizada com o HP e moedas vindos do servidor
                    players[myId].hp = serverPlayers[id].hp;
                    players[myId].coins = serverPlayers[id].coins;
                    players[myId].speed = serverPlayers[id].speed;
                    players[myId].maxHp = serverPlayers[id].maxHp;
                } else {
                    players[id] = serverPlayers[id];
                }
            }

            if (myId && players[myId]) {
                document.getElementById('coins').innerText = players[myId].coins;
                document.getElementById('hp').innerText = Math.round(players[myId].hp);
            }
        });

        function buyUpgrade(type) {
            socket.emit('upgrade', type);
        }

        // Loop principal local (60 FPS): Move o jogador instantaneamente na tela e avisa o servidor
        function gameLoop() {
            if (myId && players[myId]) {
                let p = players[myId];
                let currentSpeed = p.speed || 4;

                // Predição local: Movimento sem delay na tela do usuário
                if (keys.up) p.y -= currentSpeed;
                if (keys.down) p.y += currentSpeed;
                if (keys.left) p.x -= currentSpeed;
                if (keys.right) p.x += currentSpeed;

                // Limites da arena aplicados localmente
                p.x = Math.max(p.radius, Math.min(arenaSize.width - p.radius, p.x));
                p.y = Math.max(p.radius, Math.min(arenaSize.height - p.radius, p.y));

                // Envia o comando para o servidor processar em segundo plano
                socket.emit('move', keys);
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        // Função de desenho gráfica no Canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenha a grade de fundo da arena
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Desenha cada Verity conectado
            for (let id in players) {
                let p = players[id];

                ctx.save();
                ctx.translate(p.x, p.y);

                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();

                if (verityImg.complete) {
                    ctx.drawImage(verityImg, -p.radius, -p.radius, p.radius * 2, p.radius * 2);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.fill();
                }
                ctx.restore();

                // Borda do Verity (destaca o seu próprio com cor ciano)
                ctx.strokeStyle = (id === myId) ? '#00ffcc' : '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.stroke();

                // Barra de vida acima do Verity
                ctx.fillStyle = 'red';
                ctx.fillRect(p.x - 20, p.y - p.radius - 12, 40, 6);
                ctx.fillStyle = 'lime';
                ctx.fillRect(p.x - 20, p.y - p.radius - 12, (p.hp / p.maxHp) * 40, 6);
            }
        }

        // Inicia o loop do jogo assim que carregar
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
